apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: globex-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
    - host: globex.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: globex-agent-canary
                port: {number: 8000}
