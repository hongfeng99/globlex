apiVersion: apps/v1
kind: Deployment
metadata:
  name: globex-agent-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: globex-agent-canary}
  template:
    metadata:
      labels: {app: globex-agent-canary}
    spec:
      containers:
        - name: globex-agent
          image: globex-agent:canary
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: globex-agent-canary
spec:
  selector: {app: globex-agent-canary}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: globex-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
    - host: globex.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: globex-agent-canary
                port: {number: 8000}
