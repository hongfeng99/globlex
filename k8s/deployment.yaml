apiVersion: apps/v1
kind: Deployment
metadata:
  name: globex-agent
spec:
  # 任务状态和 WebSocket 连接当前保存在进程内；接入共享任务
  # 存储前必须保持单副本，避免 HTTP 与 WS 落到不同 Pod。
  replicas: 1
  selector:
    matchLabels: {app: globex-agent}
  template:
    metadata:
      labels: {app: globex-agent}
    spec:
      terminationGracePeriodSeconds: 300
      containers:
        - name: globex-agent
          image: globex-agent:latest
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: globex-agent
spec:
  selector: {app: globex-agent}
  ports:
    - {port: 8000, targetPort: 8000}
