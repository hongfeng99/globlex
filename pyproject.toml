[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "globex-agent"
version = "0.1.0"
description = "Globex cross-platform shopping agent"
requires-python = ">=3.11,<3.12"

dependencies = [
    "faiss-cpu>=1.9,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langfuse>=3.0,<4.0",
    "numpy>=1.26,<3.0",
    "openai>=1.0,<3.0",
    "opensearch-py>=2.4,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.setuptools.package-data]
app = ["prompt/*.yml"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
