x-common-env: &common-env
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vllm:
    image: vllm/vllm-openai:v0.8.5
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-35B-A3B}
      - --served-model-name
      - globex-main
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --max-num-seqs
      - "16"
    ports: ["8100:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      start_period: 120s
      timeout: 5s
      retries: 20

  reranker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.reranker
    ports: ["8200:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  category-kb-init:
    image: globex-agent:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-prod}
    command: ["python", "scripts/init_category_kb.py", "--recreate"]
    environment:
      <<: *common-env
      TOWER_BACKEND: sentence_transformers
      TOWER_MODEL_NAME: intfloat/multilingual-e5-small
      TOWER_DEVICE: cpu
      TOWER_LOCAL_FILES_ONLY: "true"
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: admin
      CATEGORY_KB_ANALYZER: standard
    depends_on:
      opensearch: {condition: service_healthy}
    restart: "no"

  agent:
    image: globex-agent:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-prod}
    environment:
      <<: *common-env
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-vllm}
      LLM_MAIN: globex-main
      LLM_JUDGE: globex-main
      LLM_CLIENT_MAX_RETRIES: "2"
      LLM_MIDDLEWARE_MAX_ATTEMPTS: "3"
      LLM_RETRY_BACKOFF_SEC: "2"
      LLM_MAX_CONCURRENCY: "2"
      ANN_INDEX_PATH: /app/data/item_index.faiss
      TOWER_BACKEND: sentence_transformers
      TOWER_MODEL_NAME: intfloat/multilingual-e5-small
      TOWER_DEVICE: cpu
      TOWER_LOCAL_FILES_ONLY: "true"
      TOWER_QUERY_WEIGHT: "0.75"
      TOWER_USER_WEIGHT: "0.25"
      OPENSEARCH_HOST: opensearch
      CATEGORY_KB_ANALYZER: standard
      CATEGORY_KB_REQUIRED: "true"
      RERANKER_ENDPOINT: http://reranker:8000/rerank
    ports: ["8000:8000"]
    depends_on:
      opensearch: {condition: service_healthy}
      category-kb-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      vllm: {condition: service_healthy}
      reranker: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - agent-output:/app/output
      - agent-uploaded:/app/uploaded

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on:
      agent: {condition: service_healthy}

volumes:
  opensearch-data:
  redis-data:
  agent-output:
  agent-uploaded:
