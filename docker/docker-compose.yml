x-common-env: &common-env
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  vllm:
    image: vllm/vllm-openai:v0.8.5
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    command:
      - --model
      - Qwen/Qwen3-35B-A3B
      - --served-model-name
      - globex-main
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --max-num-seqs
      - "16"
    ports: ["8100:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      start_period: 120s
      timeout: 5s
      retries: 20

  reranker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.reranker
    ports: ["8200:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-prod}
    env_file: [../.env]
    environment:
      <<: *common-env
      OPENAI_BASE_URL: http://vllm:8000/v1
      OPENAI_MODEL: globex-main
      OPENSEARCH_HOST: opensearch
      STORE_REDIS_URL: redis://redis:6379/2
      RERANKER_ENDPOINT: http://reranker:8000/rerank
    ports: ["8000:8000"]
    depends_on:
      opensearch: {condition: service_healthy}
      redis: {condition: service_healthy}
      vllm: {condition: service_healthy}
      reranker: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  opensearch-data:
  redis-data:
